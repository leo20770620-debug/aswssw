<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>王者4人抽签｜分路+英雄随机抽取</title>
<style>
*{box-sizing:border-box;font-family:system-ui, sans-serif;}
body{background:#1a1d28;color:#fff;padding:20px;}
.container{max-width:900px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.wrap{background:#272b38;padding:28px;border-radius:20px;box-shadow:0 4px 18px #00000045}
.record-box{background:#272b38;padding:24px;border-radius:20px;box-shadow:0 4px 18px #00000045}
h2{text-align:center;margin-top:0;color:#ffd040;font-size:20px}
h3{color:#ffd040;margin-top:0;font-size:18px}
.input-item{margin:13px 0}
label{display:block;margin-bottom:6px;color:#ddd}
input{width:100%;padding:12px;border:1px solid #444857;background:#333847;color:#fff;border-radius:10px;font-size:16px}
button{width:100%;padding:14px;margin-top:16px;border:none;border-radius:10px;background:#ff7b29;color:#fff;font-size:19px;font-weight:bold;cursor:pointer}
#result{margin-top:24px;padding:20px;background:#303544;border-radius:12px;font-size:18px;line-height:2.1;white-space:pre-line}
#recordList{max-height:500px;overflow-y:auto;padding:12px;background:#303544;border-radius:12px;font-size:14px;line-height:1.6}
.record-item{border-bottom:1px solid #444857;padding:8px 0;}
</style>
</head>
<body>
<div class="container">
    <!-- 左侧抽签面板 -->
    <div class="wrap">
        <h2>王者4人抽签｜分路+英雄</h2>
        <div class="input-item">
            <label>选手1</label>
            <input id="p1" placeholder="输入名字">
        </div>
        <div class="input-item">
            <label>选手2</label>
            <input id="p2" placeholder="输入名字">
        </div>
        <div class="input-item">
            <label>选手3</label>
            <input id="p3" placeholder="输入名字">
        </div>
        <div class="input-item">
            <label>选手4</label>
            <input id="p4" placeholder="输入名字">
        </div>
        <button onclick="startDraw()">开始抽签</button>
        <div id="result"></div>
    </div>
    <!-- 右侧历史记录面板 -->
    <div class="record-box">
        <h3>📜抽签历史记录（最多保存10条）</h3>
        <div id="recordList"></div>
    </div>
</div>

<script>
// 王者英雄池，不含辅助
const heroPool = {
  "对抗路":["马超","花木兰","李信","夏洛特","关羽","元歌","孙策","狂铁","吕布","夏侯惇","白起","司空震","亚连","老夫子","程咬金","廉颇","项羽","钟无艳","芈月","曹操"],
  "打野":["澜","镜","裴擒虎","露娜","韩信","李白","曜","赵怀真","云缨","阿轲","百里玄策","孙悟空","典韦","铠","兰陵王","娜可露露","橘右京","宫本武藏","刘备","盘古"],
  "中路":["少司缘","海月","上官婉儿","不知火舞","西施","王昭君","甄姬","诸葛亮","司马懿","嬴政","扁鹊","周瑜","弈星","沈梦溪","墨子","张良","安琪拉","妲己","高渐离","姜子牙"],
  "射手":["公孙离","马可波罗","孙尚香","狄仁杰","百里守约","戈娅","伽罗","后羿","鲁班七号","黄忠","李元芳","艾琳","蒙犽","莱西奥","成吉思汗"]
};
// 抽签计数器
let drawCount = 0;
// 历史记录数组，最多10条
let recordList = [];

// 洗牌函数
function shuffle(arr){
  let temp = [...arr];
  for(let i = temp.length -1; i>0; i--){
    const r = Math.floor(Math.random()*(i+1));
    [temp[i], temp[r]] = [temp[r], temp[i]];
  }
  return temp;
}

// 获取北京时间
function getBeijingTime(){
  const now = new Date();
  return now.toLocaleString('zh-CN', {timeZone:'Asia/Shanghai'});
}

// 渲染右侧历史记录
function renderRecord(){
  const recordDom = document.getElementById('recordList');
  let html = "";
  recordList.forEach(item=>{
    html += `<div class="record-item">${item}</div>`;
  })
  recordDom.innerHTML = html;
}

function startDraw(){
  // 获取4个选手名字
  const names = [
    document.getElementById('p1').value.trim(),
    document.getElementById('p2').value.trim(),
    document.getElementById('p3').value.trim(),
    document.getElementById('p4').value.trim(),
  ].filter(x=>x);

  if(names.length !==4){
    document.getElementById('result').innerText = "⚠️请填写全部4位选手名字！";
    return;
  }

  drawCount += 1;
  // 随机打乱4条分路，分配给4个人
  const lanes = Object.keys(heroPool);
  const randomLanes = shuffle(lanes);

  let resText = `✅【第${drawCount}次抽签】｜北京时间：${getBeijingTime()}\n`;
  for(let i=0;i<4;i++){
    const lane = randomLanes[i];
    const heroList = heroPool[lane];
    const randomHero = heroList[Math.floor(Math.random() * heroList.length)];
    resText += `${names[i]} → ${lane}【${randomHero}】\n`;
  }
  document.getElementById('result').innerText = resText;

  // 添加到历史记录，最多保留10条，超过自动删掉最早一条
  recordList.unshift(resText);
  if(recordList.length > 10){
    recordList.pop();
  }
  renderRecord();
}
</script>
</body>
</html>
